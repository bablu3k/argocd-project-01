apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx
  namespace: nginx

  labels:
    app: nginx

spec:
  replicas: 2

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: nginx

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:

    metadata:
      labels:
        app: nginx

    spec:

      initContainers:

        - name: prepare-nginx-html

          image: busybox:1.36

          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e

              echo "Preparing nginx HTML directory..."

              mkdir -p /nfs/nginx-html

              echo "Copying index.html from ConfigMap to NFS..."

              cp /html-source/index.html /nfs/nginx-html/index.html

              chmod 0644 /nfs/nginx-html/index.html

              echo "HTML file copied successfully."

              ls -lah /nfs/nginx-html

          volumeMounts:

            - name: nginx-storage
              mountPath: /nfs

            - name: nginx-html-source
              mountPath: /html-source
              readOnly: true


      containers:

        - name: nginx

          image: nginx:1.29-alpine

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 80
              protocol: TCP

          volumeMounts:

            - name: nginx-storage
              mountPath: /usr/share/nginx/html
              subPath: nginx-html

          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:

            httpGet:
              path: /
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /
              port: http

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3


      volumes:

        - name: nginx-storage

          persistentVolumeClaim:
            claimName: nginx-data


        - name: nginx-html-source

          configMap:
            name: nginx-html-source
