apiVersion: v1
kind: PersistentVolume

metadata:
  name: nginx-nfs-pv

  annotations:
    argocd.argoproj.io/sync-options: Prune=false

spec:
  capacity:
    storage: 1Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  mountOptions:
    - hard

  nfs:
    server: 192.168.20.204
    path: /mnt/k8s-nfs-share/argocd/nginx
